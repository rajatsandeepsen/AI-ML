<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MNIST Camera Detector (TFLite JS)</title>
  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #e2e8f0;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    video, canvas {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #334155;
      background: black;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
    }

    button, input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
    }

    input {
      min-width: 280px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #334155;
    }

    .result {
      font-size: 18px;
      margin-top: 10px;
    }

    .probs {
      margin-top: 8px;
      display: grid;
      gap: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .muted {
      color: #94a3b8;
      font-size: 13px;
    }

    .status {
      color: #93c5fd;
      font-size: 13px;
      margin-top: 8px;
    }

    @media (max-width: 860px) {
      .row {
        grid-template-columns: 1fr;
      }

      input {
        min-width: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="muted">Digital Handwriting Detector (Browser)</div>

      <div class="toolbar">
        <button id="predictBtn">Predict</button>
      </div>

      <div id="status" class="status">Status: waiting for model load</div>
    </div>

    <div class="row">
      <div class="card">
        <div class="muted" style="margin-bottom:8px;">Camera feed</div>
        <video id="video" autoplay playsinline></video>
      </div>

      <div class="card">
        <div class="muted" style="margin-bottom:8px;">Processed 28x28 preview (scaled)</div>
        <canvas id="preview" width="280" height="280"></canvas>
        <div class="result" id="result">Prediction: -</div>
        <div class="probs" id="probs"></div>
      </div>
    </div>
  </div>

  <canvas id="work" width="280" height="280" style="display:none;"></canvas>
  <canvas id="small" width="28" height="28" style="display:none;"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite/dist/tf-tflite.min.js"></script>

  <script>
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const work = document.getElementById('work');
    const small = document.getElementById('small');

    const predictBtn = document.getElementById('predictBtn');
    const statusEl = document.getElementById('status');

    const resultEl = document.getElementById('result');
    const probsEl = document.getElementById('probs');

    const workCtx = work.getContext('2d', { willReadFrequently: true });
    const smallCtx = small.getContext('2d', { willReadFrequently: true });
    const previewCtx = preview.getContext('2d');

    const MODEL_PATH = '/model.tflite';
    const TFLITE_WASM_BASE = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite/dist/';
    let tfliteModel = null;

    function setStatus(text) {
      statusEl.textContent = `Status: ${text}`;
    }

    async function loadModel() {
      try {
        tflite.setWasmPath(TFLITE_WASM_BASE);
        setStatus(`loading model from ${MODEL_PATH}...`);
        tfliteModel = await tflite.loadTFLiteModel(MODEL_PATH, { numThreads: 1 });
        const inputInfo = tfliteModel?.inputs?.[0];
        const shapeInfo = Array.isArray(inputInfo?.shape) ? JSON.stringify(inputInfo.shape) : 'unknown';
        const dtypeInfo = inputInfo?.dtype || 'unknown';
        setStatus(`model loaded (${MODEL_PATH}) input=${shapeInfo} dtype=${dtypeInfo}. starting camera...`);
        await startCamera();
        setStatus(`ready: model loaded and camera started`);
      } catch (error) {
        tfliteModel = null;
        setStatus(`model load failed: ${error}`);
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false,
        });
        video.srcObject = stream;
      } catch (error) {
        alert('Camera permission failed: ' + error);
      }
    }

    function to28x28Pixels() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) {
        throw new Error('camera not ready');
      }

      const size = Math.min(vw, vh);
      const sx = Math.floor((vw - size) / 2);
      const sy = Math.floor((vh - size) / 2);

      workCtx.drawImage(video, sx, sy, size, size, 0, 0, 280, 280);

      const workImage = workCtx.getImageData(0, 0, 280, 280);
      const data = workImage.data;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;
      }

      workCtx.putImageData(workImage, 0, 0);

      smallCtx.drawImage(work, 0, 0, 28, 28);
      const smallImage = smallCtx.getImageData(0, 0, 28, 28);
      const pixels = [];

      let sum = 0;
      for (let i = 0; i < smallImage.data.length; i += 4) {
        sum += smallImage.data[i];
      }
      const mean = sum / 784;
      const invert = mean > 127;

      for (let i = 0; i < smallImage.data.length; i += 4) {
        let v = smallImage.data[i];
        if (invert) v = 255 - v;
        pixels.push(v / 255.0);
        smallImage.data[i] = v;
        smallImage.data[i + 1] = v;
        smallImage.data[i + 2] = v;
        smallImage.data[i + 3] = 255;
      }

      smallCtx.putImageData(smallImage, 0, 0);

      previewCtx.imageSmoothingEnabled = false;
      previewCtx.clearRect(0, 0, 280, 280);
      previewCtx.drawImage(small, 0, 0, 280, 280);

      return pixels;
    }

    function getModelInputSpec() {
      const modelInput = tfliteModel?.inputs?.[0];
      const rawShape = Array.isArray(modelInput?.shape) ? modelInput.shape : [1, 28, 28, 1];
      const shape = rawShape.map((d) => (d == null || d < 1 ? 1 : d));
      const dtype = modelInput?.dtype === 'int32' ? 'int32' : 'float32';
      return { shape, dtype };
    }

    function createModelInputTensor(normalizedPixels) {
      const { shape, dtype } = getModelInputSpec();
      const elementCount = shape.reduce((acc, dim) => acc * dim, 1);

      if (elementCount !== normalizedPixels.length) {
        throw new Error(`input shape mismatch. model expects ${JSON.stringify(shape)} (${elementCount} values), got ${normalizedPixels.length}`);
      }

      const values = dtype === 'int32'
        ? normalizedPixels.map((v) => Math.round(v * 255))
        : normalizedPixels;

      return tf.tensor(values, shape, dtype);
    }

    async function runPrediction() {
      let input = null;
      let output = null;

      try {
        if (!tfliteModel) {
          throw new Error('model not loaded');
        }

        const pixels = to28x28Pixels();
        input = createModelInputTensor(pixels);
        output = tfliteModel.predict(input);

        const outputTensor = Array.isArray(output) ? output[0] : output;
        if (!outputTensor || typeof outputTensor.data !== 'function') {
          throw new Error('model output is not a tensor');
        }

        const probs = Array.from(await outputTensor.data());

        let bestIdx = 0;
        let bestVal = probs[0];
        for (let i = 1; i < probs.length; i++) {
          if (probs[i] > bestVal) {
            bestVal = probs[i];
            bestIdx = i;
          }
        }

        resultEl.textContent = `Prediction: ${bestIdx}`;

        probsEl.innerHTML = '';
        probs.forEach((p, i) => {
          const row = document.createElement('div');
          row.textContent = `${i}: ${Number(p).toFixed(3)}`;
          probsEl.appendChild(row);
        });
      } catch (error) {
        resultEl.textContent = `Error: ${error}`;
        setStatus(`prediction failed: ${error}`);
      } finally {
        if (input) input.dispose();
        if (Array.isArray(output)) {
          output.forEach((t) => t?.dispose?.());
        } else if (output) {
          output.dispose();
        }
      }
    }

    predictBtn.addEventListener('click', runPrediction);

    loadModel();
  </script>
</body>
</html>
